<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="0" y="0" width="660" height="500" fill="#ffffff" />

  <!-- header -->
  <text x="30" y="34" font-size="19" font-weight="600" fill="#0b0b0b">Buck2 vs Cabal build times</text>
  <text x="30" y="54" font-size="12.5" fill="#52514e">Building the Cabal project itself &#8212; 16 packages, 641 source files</text>

  <!-- legend -->
  <rect x="30" y="66" width="10" height="10" rx="2" fill="#2a78d6" />
  <text x="46" y="75" font-size="12.5" fill="#52514e">Cabal</text>
  <rect x="100" y="66" width="10" height="10" rx="2" fill="#eb6834" />
  <text x="116" y="75" font-size="12.5" fill="#52514e">Buck2</text>

  <!-- gridlines + y ticks -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="70" y1="390" x2="610" y2="390" />
    <line x1="70" y1="340" x2="610" y2="340" />
    <line x1="70" y1="290" x2="610" y2="290" />
    <line x1="70" y1="240" x2="610" y2="240" />
    <line x1="70" y1="190" x2="610" y2="190" />
    <line x1="70" y1="140" x2="610" y2="140" />
    <line x1="70" y1="90"  x2="610" y2="90" />
  </g>
  <g font-size="11" fill="#898781" text-anchor="end">
    <text x="60" y="393.5">0</text>
    <text x="60" y="343.5">50</text>
    <text x="60" y="293.5">100</text>
    <text x="60" y="243.5">150</text>
    <text x="60" y="193.5">200</text>
    <text x="60" y="143.5">250</text>
    <text x="60" y="93.5">300</text>
  </g>

  <!-- baseline -->
  <line x1="70" y1="390" x2="610" y2="390" stroke="#c3c2b7" stroke-width="1" />

  <!-- bars -->
  <g>
    <!-- Clean build / Optimised -->
    <rect x="112.5" y="110" width="24" height="280" rx="4" fill="#2a78d6" />
    <text x="124.5" y="103" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">280s</text>
    <rect x="138.5" y="131" width="24" height="259" rx="4" fill="#eb6834" />
    <text x="150.5" y="124" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">259s</text>

    <!-- Clean build / Unoptimised -->
    <rect x="247.5" y="254" width="24" height="136" rx="4" fill="#2a78d6" />
    <text x="259.5" y="247" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">136s</text>
    <rect x="273.5" y="312" width="24" height="78" rx="4" fill="#eb6834" />
    <text x="285.5" y="305" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">78s</text>

    <!-- Edit + rebuild / Optimised -->
    <rect x="382.5" y="193" width="24" height="197" rx="4" fill="#2a78d6" />
    <text x="394.5" y="186" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">197s</text>
    <rect x="408.5" y="211" width="24" height="179" rx="4" fill="#eb6834" />
    <text x="420.5" y="204" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">179s</text>

    <!-- Edit + rebuild / Unoptimised -->
    <rect x="517.5" y="305" width="24" height="85" rx="4" fill="#2a78d6" />
    <text x="529.5" y="298" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">85s</text>
    <rect x="543.5" y="335" width="24" height="55" rx="4" fill="#eb6834" />
    <text x="555.5" y="328" font-size="11" text-anchor="middle" fill="#52514e" font-variant-numeric="tabular-nums">55s</text>
  </g>

  <!-- x-axis group labels -->
  <g font-size="11.5" fill="#52514e" text-anchor="middle">
    <text x="137.5" y="410">Clean build</text>
    <text x="137.5" y="424">Optimised</text>

    <text x="272.5" y="410">Clean build</text>
    <text x="272.5" y="424">Unoptimised</text>

    <text x="407.5" y="410">Edit + rebuild</text>
    <text x="407.5" y="424">Optimised</text>

    <text x="542.5" y="410">Edit + rebuild</text>
    <text x="542.5" y="424">Unoptimised</text>
  </g>

  <!-- footnote -->
  <text x="30" y="458" font-size="11.5" fill="#898781">
    <tspan x="30" dy="0">Clean build and edit+rebuild (single edit to Language.Haskell.Extension) timings, each in optimised and</tspan>
    <tspan x="30" dy="15">unoptimised/dynamic mode. Buck2 clean builds include the cabal buck2 step.</tspan>
  </text>
</svg>
