# The tests of the rules (tests/rules), run with each GHC version that the
# rules support, on Linux and macOS. They run without the persistent worker
# and with it, and each of those with GHC's internal interpreter and with
# -fexternal-interpreter. One job runs all four, so that it installs GHC
# once. The GHC versions are the same as the worker's (see
# buck2-ghc-worker.yml). The tests build a small project that uses only
# GHC's own packages, so they need just GHC, buck2 and a C compiler. The
# worker uses only GHC's packages too, and the toolchain builds it.
name: rules

# Pushes are only tested on master and the release branches (0.6.0.0, say).
# A branch with a pull request is tested by the pull_request event, and
# testing its pushes as well would run every job twice. A change only to
# files that the tests don't read, such as documentation, runs nothing.
on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
    paths-ignore: &untested ["**.md", "**.svg", LICENSE, flake.nix, flake.lock, template/**]
  pull_request:
    paths-ignore: *untested
  workflow_dispatch:

# A newer run for the same pull request or branch cancels an older one that
# is still queued or running, such as the run of a commit that a force-push
# replaced. GitHub runs only a few macOS jobs at a time for all of the
# account's repositories together, so an outdated run would hold up the
# runs that matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The version of buck2 in the nixpkgs that flake.lock pins, so that CI and
  # `nix flake check` test with the same buck2. Update the two together.
  BUCK2_VERSION: "2026-10-15"
  # The bazel-remote that check_cache runs as a remote cache.
  BAZEL_REMOTE_VERSION: "2.6.3"

jobs:
  rules:
    name: rules (${{ matrix.os }}, GHC ${{ matrix.ghc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ["9.6.7", "9.8.4", "9.10.3", "9.12.4", "9.14.1"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The image's Command Line Tools are newer than its default Xcode, and
      # GHC's links end up with the Command Line Tools' SDK, whose stubs
      # Xcode's linker can't read. Use the Command Line Tools, linker and
      # all. See https://github.com/actions/runner-images/issues/14940:
      # remove this once it's fixed.
      - name: Use the Command Line Tools
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Install GHC
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          # The tests don't use cabal, though the action installs it anyway.
          cabal-update: false

      - name: Install buck2
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=x86_64-unknown-linux-gnu ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            *) echo "no buck2 release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${target}.zst" \
            | zstd -d > "$HOME/.local/bin/buck2"
          chmod +x "$HOME/.local/bin/buck2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install bazel-remote
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=linux-amd64 ;;
            macOS-ARM64) target=darwin-arm64 ;;
            *) echo "no bazel-remote release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/bazel-remote" \
            "https://github.com/buchgr/bazel-remote/releases/download/v${BAZEL_REMOTE_VERSION}/bazel-remote-${BAZEL_REMOTE_VERSION}-${target}"
          chmod +x "$RUNNER_TEMP/bazel-remote"
          echo "BAZEL_REMOTE=$RUNNER_TEMP/bazel-remote" >> "$GITHUB_ENV"

      - name: Test
        id: test
        env:
          PER_MODULE_WORKER: none
        run: tests/rules/run.sh "$(dirname "${{ steps.setup.outputs.ghc-exe }}")" "$RUNNER_TEMP/rules"

      # The toolchain builds the worker (per_module_worker = builtin), with
      # the GHC under test. This runs even if the tests without the worker
      # failed.
      - name: Test with the worker
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          PER_MODULE_WORKER: builtin
        run: tests/rules/run.sh "$(dirname "${{ steps.setup.outputs.ghc-exe }}")" "$RUNNER_TEMP/rules-worker"

      # With -fexternal-interpreter in the toolchain's compiler flags, splices
      # run in external interpreters, without the worker and with it. These
      # run even if the steps before them failed.
      - name: Test with -fexternal-interpreter
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          PER_MODULE_WORKER: none
          EXTERNAL_INTERPRETER: "true"
        run: tests/rules/run.sh "$(dirname "${{ steps.setup.outputs.ghc-exe }}")" "$RUNNER_TEMP/rules-ext"

      - name: Test with the worker and -fexternal-interpreter
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          PER_MODULE_WORKER: builtin
          EXTERNAL_INTERPRETER: "true"
        run: tests/rules/run.sh "$(dirname "${{ steps.setup.outputs.ghc-exe }}")" "$RUNNER_TEMP/rules-worker-ext"

      - name: Upload the buck2 logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buck-logs-${{ matrix.os }}-${{ matrix.ghc }}
          path: |
            ${{ runner.temp }}/rules/project/buck-logs
            ${{ runner.temp }}/rules-worker/project/buck-logs
            ${{ runner.temp }}/rules-ext/project/buck-logs
            ${{ runner.temp }}/rules-worker-ext/project/buck-logs
