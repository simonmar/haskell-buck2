# Tests for the rules (tests/rules), with the GHC versions
# they support (9.6 to 9.14). They build a small project with GHC's own
# packages alone, so they need GHC, buck2 and a C compiler, not cabal or
# Hackage.
name: rules

on:
  - push
  - pull_request
  - workflow_dispatch

env:
  BUCK2_VERSION: "2026-10-15"
  # Likewise, the bazel-remote of check_cache's remote cache.
  BAZEL_REMOTE_VERSION: "2.6.3"

jobs:
  rules:
    name: rules (${{ matrix.os }}, GHC ${{ matrix.ghc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ["9.6.7", "9.8.4", "9.10.3", "9.12.4", "9.14.1"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install GHC
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Install buck2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-unknown-linux-gnu.zst" \
            | zstd -d > "$HOME/.local/bin/buck2"
          chmod +x "$HOME/.local/bin/buck2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install bazel-remote
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bazel-remote" \
            "https://github.com/buchgr/bazel-remote/releases/download/v${BAZEL_REMOTE_VERSION}/bazel-remote-${BAZEL_REMOTE_VERSION}-linux-amd64"
          chmod +x "$RUNNER_TEMP/bazel-remote"
          echo "BAZEL_REMOTE=$RUNNER_TEMP/bazel-remote" >> "$GITHUB_ENV"

      - name: Test
        run: tests/rules/run.sh "$(dirname "${{ steps.setup.outputs.ghc-exe }}")" "$RUNNER_TEMP/rules"

      - name: Upload the buck2 logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buck-logs-${{ matrix.ghc }}
          path: ${{ runner.temp }}/rules/project/buck-logs
