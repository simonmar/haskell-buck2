# Tests for the rules (tests/rules), with the GHC versions
# they support (9.6 to 9.14), on Linux and macOS. They build a small project
# with GHC's own packages alone, so they need GHC, buck2 and a C compiler,
# not cabal or Hackage.
name: rules

# Pushes are only tested on master and the release branches (0.6.0.0, say).
# A branch with a pull request is tested by the pull_request event, and
# testing its pushes as well would run every job twice.
on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

env:
  BUCK2_VERSION: "2026-10-15"
  # The bazel-remote that check_cache runs as a remote cache.
  BAZEL_REMOTE_VERSION: "2.6.3"

jobs:
  rules:
    name: rules (${{ matrix.os }}, GHC ${{ matrix.ghc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ["9.6.7", "9.8.4", "9.10.3", "9.12.4", "9.14.1"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The image's Command Line Tools are newer than its default Xcode, and
      # GHC's links end up with the Command Line Tools' SDK, whose stubs
      # Xcode's linker can't read. Use the Command Line Tools, linker and
      # all. See https://github.com/actions/runner-images/issues/14940:
      # remove this once it's fixed.
      - name: Use the Command Line Tools
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Install GHC
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Install buck2
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=x86_64-unknown-linux-gnu ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            *) echo "no buck2 release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-${target}.zst" \
            | zstd -d > "$HOME/.local/bin/buck2"
          chmod +x "$HOME/.local/bin/buck2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install bazel-remote
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=linux-amd64 ;;
            macOS-ARM64) target=darwin-arm64 ;;
            *) echo "no bazel-remote release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/bazel-remote" \
            "https://github.com/buchgr/bazel-remote/releases/download/v${BAZEL_REMOTE_VERSION}/bazel-remote-${BAZEL_REMOTE_VERSION}-${target}"
          chmod +x "$RUNNER_TEMP/bazel-remote"
          echo "BAZEL_REMOTE=$RUNNER_TEMP/bazel-remote" >> "$GITHUB_ENV"

      - name: Test
        run: tests/rules/run.sh "$(dirname "${{ steps.setup.outputs.ghc-exe }}")" "$RUNNER_TEMP/rules"

      - name: Upload the buck2 logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buck-logs-${{ matrix.os }}-${{ matrix.ghc }}
          path: ${{ runner.temp }}/rules/project/buck-logs
