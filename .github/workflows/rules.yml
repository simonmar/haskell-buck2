# Tests for the rules (tests/rules), with each GHC version they support
# (the same as the persistent worker's, see ghc-worker.yml), both without the
# worker and with it. They build a small project with only GHC's own
# packages, so they need just GHC, buck2 and a C compiler. cabal and Hackage
# are only needed to build the worker.
name: rules

on:
  - push
  - pull_request
  - workflow_dispatch

env:
  # The buck2 of the nixpkgs that flake.lock pins, so that CI and `nix
  # flake check` test the same buck2. Update the two together.
  BUCK2_VERSION: "2026-10-15"

jobs:
  rules:
    name: rules (${{ matrix.os }}, GHC ${{ matrix.ghc }}${{ matrix.worker && ', worker' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ["9.6.7", "9.8.4", "9.10.3", "9.12.4", "9.14.1"]
        worker: [false, true]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install GHC
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Install buck2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-unknown-linux-gnu.zst" \
            | zstd -d > "$HOME/.local/bin/buck2"
          chmod +x "$HOME/.local/bin/buck2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the worker
        if: matrix.worker
        working-directory: tools/ghc-worker
        run: |
          cabal update
          cabal install --installdir="$RUNNER_TEMP/bin" exe:ghc-worker
          echo "GHC_WORKER=$RUNNER_TEMP/bin/ghc-worker" >> "$GITHUB_ENV"

      - name: Test
        run: tests/rules/run.sh "$(dirname "${{ steps.setup.outputs.ghc-exe }}")" "$RUNNER_TEMP/rules"

      - name: Upload the buck2 logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buck-logs-${{ matrix.ghc }}${{ matrix.worker && '-worker' || '' }}
          path: ${{ runner.temp }}/rules/project/buck-logs
