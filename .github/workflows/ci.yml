name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc-version: ['9.6.7', '9.8.4', '9.10.3', '9.12.4', '9.14.1']
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc-version }}
          cabal-version: '3.14.2.0'

      # Pinned, not `latest`: the `latest` tag is a rolling nightly, and
      # buck2 core's builtin API drifts against whatever prelude/ snapshot
      # is checked into this repo - confirmed directly, `latest` (as of
      # 2026-09-16, built from the 2026-09-15 nightly) fails to even
      # *load* prelude//cxx/link.bzl ("Unexpected parameter named
      # `eager_materialization_enabled`"), while the 2026-09-01 dated
      # release still builds and tests this repo's example/ cleanly in
      # both dev and opt mode. Bump this tag deliberately, together with
      # prelude/, rather than letting it silently float.
      - name: Install buck2
        run: |
          curl -fL https://github.com/facebook/buck2/releases/download/2026-09-01/buck2-x86_64-unknown-linux-gnu.zst -o /tmp/buck2.zst
          zstd -d /tmp/buck2.zst -o /usr/local/bin/buck2
          chmod +x /usr/local/bin/buck2
          buck2 --version

      # example/ is a fixture Cabal package (TemplateHaskell, an .hsc
      # file, and C++/FFI via cxx-sources) used to test-drive this repo's
      # own buck2 support end to end, the same way the README describes
      # a real consumer using it - cloning this repo as `buck2/` inside
      # their own Cabal project. Here it's already checked out (this repo
      # *is* the checkout), so a symlink stands in for the clone.
      - name: Point example/ at this checkout's buck2/ prelude
        run: ln -sfn "$(pwd)" example/buck2

      - name: cabal build --only-dependencies (also generates dist-newstyle/cache/plan.json for gen-haskell-prebuilt.py)
        working-directory: example
        run: |
          cabal update
          cabal build all --only-dependencies --enable-tests

      - name: Generate haskell_prebuilt_library() rules
        working-directory: example
        run: python3 buck2/gen-haskell-prebuilt.py

      - name: buck2 build (dev)
        working-directory: example
        run: buck2 build //...

      - name: buck2 test (dev)
        working-directory: example
        run: buck2 test //...

      - name: buck2 build (opt)
        working-directory: example
        run: buck2 build -m opt //...

      - name: buck2 test (opt)
        working-directory: example
        run: buck2 test -m opt //...
